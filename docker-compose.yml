services:
  claims_service:
    build: .
    container_name: claims_service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/claims_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis

  claims_worker:
    build: .
    container_name: claims_worker
    command: celery -A comun.celery_app worker -Q claims --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/claims_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: claims_db
    environment:
      POSTGRES_DB: claims_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: claims_redis
    ports:
      - "6383:6379"

volumes:
  postgres_data:
